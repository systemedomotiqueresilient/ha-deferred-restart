[project]
name = "ha-deferred-restart"
version = "0.3.1"
description = "Home Assistant integration that defers voluntary restarts around scheduled automations"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/deferred_restart"]

[tool.coverage.report]
fail_under = 50
show_missing = true

# Règles alignées sur ha-sdr : admin_phone.py doit passer ici sans modification.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
